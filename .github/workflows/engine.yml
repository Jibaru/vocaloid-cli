name: engine
on:
  push:
    tags: ["engine-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            os: macos-14
          - rid: linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: engine/build.sh ${{ matrix.rid }} out
      - name: Package
        run: |
          tar -czf openutau-cli-${{ matrix.rid }}.tar.gz -C out .
          shasum -a 256 openutau-cli-${{ matrix.rid }}.tar.gz > openutau-cli-${{ matrix.rid }}.tar.gz.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openutau-cli-${{ matrix.rid }}.tar.gz
            openutau-cli-${{ matrix.rid }}.tar.gz.sha256
